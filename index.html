<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXORA | Cyber Technology</title>
<meta name="description" content="NEXORA - Explore the future of cyber technology, digital security and innovation.">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050a08;
    color: #eaffea;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 8%;
    border-bottom: 1px solid #173b25;
}

.logo {
    color: #39ff70;
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 3px;
}

nav a {
    color: #b7c9bc;
    text-decoration: none;
    margin-left: 20px;
    font-size: 14px;
}

nav a:hover {
    color: #39ff70;
}

.hero {
    min-height: 80vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px 20px;
}

.tag {
    color: #39ff70;
    border: 1px solid #39ff70;
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 12px;
    letter-spacing: 2px;
}

h1 {
    font-size: clamp(45px, 10vw, 85px);
    margin: 25px 0;
    letter-spacing: 8px;
    color: #39ff70;
    text-shadow: 0 0 25px #16ff5060;
}

.hero p {
    max-width: 550px;
    color: #a2b5a7;
    line-height: 1.8;
}

.btn {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 30px;
    background: #39ff70;
    color: #041008;
    text-decoration: none;
    font-weight: bold;
    border-radius: 5px;
}

.btn:hover {
    box-shadow: 0 0 25px #39ff70;
}

footer {
    text-align: center;
    padding: 25px;
    border-top: 1px solid #173b25;
    color: #64776a;
    font-size: 13px;
}

@media(max-width: 600px) {
    header {
        flex-direction: column;
        gap: 18px;
    }

    nav a {
        margin: 0 8px;
    }

    h1 {
        letter-spacing: 4px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">NEXORA</div>

    <nav>
        <a href="#">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero">

    <div class="tag">WELCOME TO THE DIGITAL FRONTIER</div>

    <h1>NEXORA</h1>

    <p>
        Explore the future of technology.
        Innovation, digital security and creativity
        come together in one place.
    </p>

    <a href="#about" class="btn">EXPLORE MORE</a>

</section>

<footer id="about">
    © 2026 NEXORA. All Rights Reserved.
</footer>

</body>
</html>
