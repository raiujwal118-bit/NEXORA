<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next-Gen Tech | NEXORA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050a08; color: #eaffea; font-family: 'Courier New', Courier, monospace; min-height: 100vh; padding: 40px 8%; }
        .back-btn { display: inline-block; color: #39ff70; text-decoration: none; margin-bottom: 30px; font-weight: bold; font-family: Arial, sans-serif; }
        .back-btn:hover { text-decoration: underline; }
        h1 { font-size: 36px; color: #ffffff; margin-bottom: 15px; border-bottom: 2px solid #173b25; padding-bottom: 10px; font-family: Arial, sans-serif; }
        p { color: #8fa89b; font-size: 16px; line-height: 1.6; margin-bottom: 40px; font-family: Arial, sans-serif; }
        
        .terminal-card { background: #08110c; border: 1px solid #173b25; border-radius: 8px; max-width: 700px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); overflow: hidden; }
        .terminal-header { background: #112217; padding: 10px 15px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #173b25; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot-red { background: #ff4d4d; }
        .dot-yellow { background: #ffaa00; }
        .dot-green { background: #39ff70; }
        .terminal-title { margin-left: 10px; font-size: 14px; color: #8fa89b; font-family: Arial, sans-serif; }
        
        .terminal-body { padding: 20px; height: 300px; overflow-y: auto; font-size: 14px; color: #39ff70; display: flex; flex-direction: column; gap: 10px; }
        .log-line { margin-bottom: 4px; }
        .log-dim { color: #8fa89b; }
        
        .terminal-input-area { display: flex; border-top: 1px solid #173b25; background: #050a08; padding: 10px 15px; align-items: center; }
        .prompt-symbol { color: #39ff70; font-weight: bold; margin-right: 10px; }
        .terminal-input { background: transparent; border: none; outline: none; color: #eaffea; font-family: 'Courier New', Courier, monospace; font-size: 14px; flex-grow: 1; }
        .run-btn { background: #173b25; border: 1px solid #39ff70; color: #39ff70; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; }
        .run-btn:active { background: #39ff70; color: #050a08; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">&#8592; Back to Home</a>
    <h1>Next-Gen Technology & Systems</h1>
    <p>Exploring cutting-edge breakthroughs, quantum architectures, and autonomous AI integrations.</p>

    <div class="terminal-card">
        <div class="terminal-header">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
            <span class="terminal-title">nexora@ai-sandbox:~</span>
        </div>
        <div id="terminal-body" class="terminal-body">
            <div class="log-line">NEXORA Neural Interface v4.0.2 Initialized.</div>
            <div class="log-line log-dim">Type 'help' to view available diagnostic commands.</div>
            <br>
        </div>
        <form id="term-form" class="terminal-input-area" onsubmit="return false;">
            <span class="prompt-symbol">&gt;</span>
            <input type="text" id="term-input" class="terminal-input" placeholder="Type command here..." autofocus autocomplete="off" />
            <button type="button" id="run-btn" class="run-btn">RUN</button>
        </form>
    </div>

    <script>
        const termBody = document.getElementById('terminal-body');
        const termInput = document.getElementById('term-input');
        const runBtn = document.getElementById('run-btn');

        function processCommand() {
            const cmd = termInput.value.trim().toLowerCase();
            if (!cmd) return;

            appendLog('> ' + cmd, '#eaffea');
            
            if (cmd === 'help') {
                appendLog('Available Commands:', '#39ff70');
                appendLog('  status    - Check core system vitals', '#8fa89b');
                appendLog('  scan      - Run deep security diagnostics', '#8fa89b');
                appendLog('  ai-connect- Establish secure quantum uplink', '#8fa89b');
                appendLog('  clear     - Clear terminal logs', '#8fa89b');
            } else if (cmd === 'status') {
                appendLog('[INFO] Core Temp: 32°C | Quantum Cores: 1024 Active | Status: Optimal', '#39ff70');
            } else if (cmd === 'scan') {
                appendLog('[SCANNING] Analyzing network sectors... No vulnerabilities detected.', '#39ff70');
            } else if (cmd === 'ai-connect') {
                appendLog('[SUCCESS] Connected to NEXORA Neural Network. AI Model online.', '#39ff70');
            } else if (cmd === 'clear') {
                termBody.innerHTML = '<div class="log-line">Terminal cleared. Type \'help\' for commands.</div><br>';
            } else {
                appendLog(`[ERROR] Command not recognized: '${cmd}'. Type 'help' for options.`, '#ff4d4d');
            }
            
            termInput.value = '';
            termBody.scrollTop = termBody.scrollHeight;
        }

        runBtn.addEventListener('click', processCommand);
        termInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                processCommand();
            }
        });

        function appendLog(text, color) {
            const div = document.createElement('div');
            div.className = 'log-line';
            div.style.color = color;
            div.innerText = text;
            termBody.appendChild(div);
        }
    </script>
</body>
</html>
